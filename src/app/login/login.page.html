<ion-content [fullscreen]="true" class="login-content">

  <div class="login-shell">
  <div class="login-brand"><span class="brand-mark" aria-hidden="true">F</span><span>FiadOS <small>Tu libreta, en orden.</small></span></div>
  <div class="login-wrap">
    <div class="store-front" aria-hidden="true"><div class="awning"></div><div class="store-window"></div><div class="store-door"></div></div>
    <p class="eyebrow">CERCA DE TU NEGOCIO</p>

    <h1 class="login-title">Qué bueno verte.</h1>
    <p class="login-subtitle">Entra para llevar las cuentas de tu tienda con tranquilidad.</p>

    <ion-item class="login-input">
      <ion-label position="floating">Usuario</ion-label>
      <ion-input
        [(ngModel)]="usuario"
        type="text"
        autocapitalize="off"
      ></ion-input>
    </ion-item>

    <ion-item class="login-input">
      <ion-label position="floating">Contraseña</ion-label>
      <ion-input
        [(ngModel)]="password"
        type="password"
      ></ion-input>
    </ion-item>

    <div class="login-error" *ngIf="errorMsg()">
      {{ errorMsg() }}
    </div>

    <ion-button
      expand="block"
      class="login-btn"
      [disabled]="cargando()"
      (click)="onLogin()"
    >
      {{ cargando() ? 'Entrando...' : 'Entrar a mi tienda' }}
    </ion-button>

  </div>
  <p class="login-footer">Las cuentas claras. La confianza de siempre.</p>
  </div>
</ion-content>
